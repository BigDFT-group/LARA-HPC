[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laraq"
version = "0.1.0"
description = "Agent-driven code generation system with multi-provider AI support"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "LARA Team"}
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "numpy>=1.20",
    "httpx>=0.24",
    "html2text",
    "fastmcp>=2.0",
    "remotemanager",
    "pyflakes",
]

[project.scripts]
laraq = "laraq.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["laraq*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
